<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhinebeck Village Sidewalk Survey</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
<style>
  * { box-sizing: border-box; }
  :root {
    --green-700: #166534;
    --green-600: #1a6b3c;
    --ink: #1a1a1a;
    --ink-soft: #4b5563;
    --ink-faint: #6b7280;
    --line: #e5e7eb;
    --bg-soft: #f9fafb;
    --radius: 10px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.08);
    --shadow-md: 0 4px 12px rgba(0,0,0,.12);
  }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: #fff; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: #fff; }
  #appVersion { font-size: 11px; color: #9ca3af; font-weight: 400; margin-left: 8px; }
  header h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13px; }
  #stats { font-size: 13px; color: var(--ink-soft); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #stats b { font-weight: 700; color: var(--ink); }
  .statDiv { width: 1px; height: 16px; background: var(--line); flex: none; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: baseline; }
  #main { display: flex; flex: 1; min-height: 0; }
  #mapWrap { flex: 1; min-width: 0; position: relative; }
  #map { width: 100%; height: 100%; }
  .mapBtn { position: absolute; z-index: 1000; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-md); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s, transform .1s; }
  .mapBtn:hover { background: var(--bg-soft); border-color: #d1d5db; }
  .mapBtn:active { transform: translateY(1px); }
  .mapBtn.active { background: var(--green-600); color: #fff; border-color: var(--green-600); }
  #locateBtn { top: 12px; right: 12px; padding: 9px; line-height: 0; height: 38px; width: 38px; box-sizing: border-box; justify-content: center; }
  #locateBtn svg { display: block; }
  #globalBtn { top: 12px; right: 58px; height: 38px; width: 38px; padding: 9px; line-height: 0; box-sizing: border-box; justify-content: center; }
  #globalBtn svg { display: block; }
  #analyticsBtn { top: 12px; right: 104px; height: 38px; box-sizing: border-box; }
  #panel { width: 340px; border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; background: #fff; min-width: 0; transition: width .3s ease, opacity .25s ease, padding .3s ease; }
  #panel.hidden { display: none; }
  #panel.collapsed { width: 0; padding: 0; opacity: 0; overflow: hidden; border-left-width: 0; }
  #panelToggle { display: flex; align-items: center; justify-content: center; gap: 8px; }
  #panelToggle svg { flex: none; }
  #panelHeader { display: flex; gap: 8px; margin: 0 0 12px; align-items: stretch; }
  #panelHeader .btn { margin: 0; padding: 8px 12px; font-size: 13px; white-space: nowrap; }
  #backBtn { flex: 1; }
  /* Sticky form actions: Save stays visible while scrolling the form. */
  .formActions { position: sticky; bottom: -16px; background: #fff; margin: 16px -16px 0; padding: 12px 16px; border-top: 1px solid transparent; display: flex; gap: 8px; align-items: center; }
  #panel.hasMoreBelow .formActions { border-top-color: var(--line); box-shadow: 0 -12px 16px -12px rgba(0,0,0,0.3); }
  .formActions .btn { margin-top: 0; }
  #saveBtn { flex: 1; padding: 8px 16px; font-size: 13px; }
  .clearFooterBtn { flex: none; }
  button.clearFlowBtn { display: none; }
  #saveStatus { margin: 0; font-size: 12px; color: var(--ink-soft); flex: none; max-width: 45%; }
  #saveStatus:empty { display: none; }
  .btn.danger-outline { background: #fff; color: #dc2626; border: 1px solid #dc2626; width: auto; padding: 8px 16px; font-size: 13px; }
  .btn.danger-outline:hover { background: #fef2f2; }
  @media (max-width: 760px) {
    button.clearFlowBtn { display: block; width: 100%; margin-top: 12px; }
    button.clearFooterBtn { display: none; }
    .formActions { display: block; }
    #saveBtn { width: 100%; }
  }
  #panel h2 { font-size: 17px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
  #panel .meta { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; line-height: 1.5; }
  #panel label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin: 16px 0 8px; }
  .condRow { display: flex; gap: 8px; margin: 4px 0 8px; }
  .condItem { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .condBox { width: 100%; aspect-ratio: 1 / 1; border: 3px solid transparent; border-radius: 8px; font-size: 20px; font-weight: 800; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; transition: transform .1s, box-shadow .15s; box-shadow: var(--shadow-sm); }
  .condBox:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .condBox.selected { border-color: var(--ink); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink); }
  .condBox:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .condLabel { font-size: 11px; color: var(--ink-soft); text-align: center; line-height: 1.2; }
  #globalBtn { top: 12px; right: 58px; }
  #globalPanel { position: absolute; top: 56px; right: 12px; z-index: 1000; width: 280px; max-width: calc(100vw - 24px); max-height: calc(100% - 68px); overflow-y: auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow-md); }
  #globalPanel.hidden { display: none; }
  .modalOverlay { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.45); padding: 20px; }
  .modalOverlay[hidden] { display: none; }
  .modalCard { background: #fff; border-radius: 12px; padding: 20px; max-width: 340px; width: 100%; box-shadow: var(--shadow-md); position: relative; }
  .modalClose { position: absolute; top: 8px; right: 10px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--ink-soft); cursor: pointer; padding: 4px; }
  .modalClose:hover { color: var(--ink); }
  .modalCard h3 { margin: 0 0 8px; font-size: 16px; }
  .modalCard p { margin: 0 0 16px; font-size: 14px; color: var(--ink-soft); }
  .modalActions { display: flex; gap: 10px; justify-content: flex-end; }
  .modalActions .btn { margin: 0; padding: 8px 14px; font-size: 13px; }
  .settingsSection { margin-bottom: 16px; }
  .settingsSection:last-child { margin-bottom: 0; }
  .settingsSection h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .optRow { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; }
  .optBox { border: 2px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink); background: #fff; transition: all .15s; }
  .optBox:hover { border-color: #d1d5db; background: var(--bg-soft); }
  .optBox.selected { border-color: var(--ink); background: var(--ink); color: #fff; }
  .optBox:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .optBox.disabled { opacity: 0.35; pointer-events: none; }
  #priorityBox.disabled { opacity: 0.35; pointer-events: none; }
  .surfaceBox { background: #dbeafe; border-color: #dbeafe; }
  .surfaceBox.selected { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  .issueBox { background: #fef3c7; border-color: #fef3c7; }
  .issueBox.selected { background: #b45309; border-color: #b45309; color: #fff; }
  /* Red drawn checkbox for Priority Fix */
  .priorityCheck { display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 8px; transition: all .15s; }
  .priorityCheck:hover { border-color: #fca5a5; background: #fef2f2; }
  .priorityCheck .checkBox { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #d1d5db; background: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; transition: all .15s; }
  .priorityCheck .checkBox svg { opacity: 0; transform: scale(0.6); transition: all .15s; }
  .priorityCheck.checked { border-color: #dc2626; background: #fef2f2; }
  .priorityCheck.checked .checkBox { background: #dc2626; border-color: #dc2626; }
  .priorityCheck.checked .checkBox svg { opacity: 1; transform: scale(1); }
  .priorityCheck:focus-visible { outline: 2px solid #dc2626; outline-offset: 2px; }
  #panel select, #panel textarea, #panel input[type="text"] { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; transition: border-color .15s, box-shadow .15s; }
  #panel select:focus, #panel textarea:focus, #panel input[type="text"]:focus { outline: none; border-color: var(--green-600); box-shadow: 0 0 0 3px rgba(26,107,60,.12); }
  #panel textarea { min-height: 76px; resize: vertical; line-height: 1.5; }
  #panel textarea::placeholder { color: #9ca3af; }
  .btn { display: inline-block; padding: 10px 18px; font-size: 14px; font-weight: 600; border: 0; border-radius: 8px; cursor: pointer; background: var(--green-600); color: #fff; margin-top: 14px; transition: background .15s, transform .1s; box-shadow: var(--shadow-sm); }
  .btn:hover { background: var(--green-700); }
  .btn:active { transform: translateY(1px); }
  .btn.secondary { background: #f3f4f6; color: var(--ink); border: 1px solid var(--line); }
  .btn.secondary:hover { background: #e5e7eb; }
  .btn:disabled { opacity: 0.5; cursor: default; transform: none; }
  #saveStatus { font-size: 13px; margin-top: 10px; min-height: 18px; font-weight: 500; }
  #saveStatus.ok { color: var(--green-600); }
  #saveStatus.warn { color: #9a6a00; }
  #saveStatus.err { color: #b00020; }
  .checkRow { display: flex; gap: 16px; }
  .checkRow label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .checkRow input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--ink); cursor: pointer; }
  .segRow { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; margin: 6px 0; font-size: 14px; font-weight: 500; text-align: left; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: all .15s; }
  .segRow:hover { background: #eef4ff; border-color: #bfdbfe; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .segDot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: baseline; flex: none; }
  .segEmpty { color: var(--ink-soft); font-size: 14px; padding: 12px 0; }
  #backBtn { margin: 0 0 12px; }
  #searchRow { display: flex; gap: 8px; margin: 12px 0; align-items: stretch; }
  #searchWrap { flex: 1; position: relative; min-width: 0; display: flex; }
  #searchWrap input { width: 100%; }
  #suggestions { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #fff; border: 1px solid var(--line); border-radius: 10px; max-height: 240px; overflow-y: auto; z-index: 1000; box-shadow: var(--shadow-md); }
  .sugg { padding: 10px 14px; font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--bg-soft); }
  .sugg:last-child { border-bottom: 0; }
  .sugg:hover, .sugg.selected { background: #eef4ff; }
  #searchRow button { padding: 10px 14px; margin-top: 0; white-space: nowrap; align-self: stretch; }
  #banner { display: none; background: #fffbeb; border-bottom: 1px solid #fde68a; padding: 12px 16px; font-size: 13px; color: #92400e; }
  #banner code { background: #fff; padding: 2px 6px; border-radius: 4px; border: 1px solid #fde68a; }
  #loading { padding: 12px 16px; font-size: 13px; color: var(--ink-soft); }
  @media (max-width: 760px) {
    #main { flex-direction: column; }
    #mapWrap { flex: 1; min-height: 0; }
    #panel { width: 100%; max-height: 70vh; border-left: 0; border-top: 1px solid var(--line); transition: max-height .3s ease, opacity .25s ease, padding .3s ease; position: relative; }
    #panel.collapsed { width: 100%; max-height: 0; padding: 0; opacity: 0; overflow: hidden; border-top-width: 0; }
    #panelHeader { position: absolute; top: 12px; right: 12px; margin: 0; }
    #panelToggle { width: auto; padding: 6px 10px; font-size: 12px; }
    #backBtn { font-size: 12px; padding: 6px 10px; }
    #panelToggle svg { transform: rotate(90deg); }
    #parcelPanel h2 { padding-right: 100px; }
    #stats { display: none; }
    header { padding: 10px 12px; }
    header h1 { font-size: 17px; }
  }
  #analyticsPanel { position: fixed; inset: 0; z-index: 2000; background: #fff; display: flex; flex-direction: column; }
  #analyticsPanel.hidden { display: none; }
  #analyticsBar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); background: #fff; }
  #analyticsBar h2 { margin: 0; font-size: 18px; }
  #analyticsBar .btn.secondary { margin-top: 0; padding: 8px 16px; font-size: 13px; border-radius: 999px; border-width: 2px; }
  #analyticsClose { padding: 8px 16px; font-size: 13px; font-weight: 600; border: 2px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; }
  #analyticsClose:hover { background: var(--bg-soft); }
  #analyticsBody { flex: 1; overflow-y: auto; padding: 16px; }
  .metricGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .metricCard { border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
  .metricCard .num { font-size: 28px; font-weight: 700; }
  .metricCard .lbl { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .chartSection { margin-bottom: 24px; }
  .chartSection h3 { font-size: 14px; margin: 0 0 12px; }
  .barRow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .barLbl { width: 100px; font-size: 13px; flex: none; }
  .barTrack { flex: 1; height: 20px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; }
  .barFill { height: 100%; border-radius: 999px; transition: width .3s; }
  .barVal { width: 40px; font-size: 13px; font-weight: 600; text-align: right; flex: none; }
  /* Keep attribution collapsed to the "i" button — never auto-expand */
  .maplibregl-ctrl-attrib.maplibregl-compact .maplibregl-ctrl-attrib-inner { display: none; }
  .maplibregl-ctrl-attrib.maplibregl-compact.show-attribution .maplibregl-ctrl-attrib-inner { display: block; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Rhinebeck Village Sidewalk Survey<span id="appVersion"></span></h1>
    <p>Tap a parcel or sidewalk to assess condition</p>
  </div>
  <div id="stats"></div>
</header>
<div id="banner"></div>
<div id="loading">Loading parcels…</div>
<div id="main">
  <div id="mapWrap">
    <div id="map"></div>
    <button class="mapBtn" id="globalBtn" type="button" aria-label="Show settings" title="Show settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h13M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg></button>
    <button class="mapBtn" id="analyticsBtn" type="button" aria-label="Show analytics" title="Show analytics"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Data</button>
    <div id="globalPanel" class="hidden">
      <div class="settingsSection">
        <h3>Sidewalks</h3>
        <div class="checkRow">
          <label><input type="checkbox" id="swAssessed" checked> Assessed</label>
          <label><input type="checkbox" id="swUnassessed" checked> Not Assessed</label>
        </div>
      </div>
      <div class="settingsSection">
        <h3>Parcels</h3>
        <div class="checkRow">
          <label><input type="checkbox" id="pAssessed" checked> Assessed</label>
          <label><input type="checkbox" id="pUnassessed" checked> Not Assessed</label>
        </div>
      </div>
      <div id="searchRow">
        <div id="searchWrap">
          <input type="text" id="searchInput" placeholder="Search address or parcel ID, e.g. 2 Mill Rd" autocomplete="off">
          <div id="suggestions"></div>
        </div>
        <button class="btn secondary" id="searchBtn" type="button">Go</button>
      </div>
    </div>
    <button class="mapBtn" id="locateBtn" type="button" aria-label="Locate me" title="Locate me"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  </div>
  <aside id="panel" class="collapsed hidden">
    <div id="panelHeader">
      <button class="btn secondary" id="panelToggle" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 9l3 3-3 3"/><path d="M10 4v16"/></svg>Hide</button>
    </div>
    <div id="parcelPanel">
      <p style="color:#555; font-size:14px;">Select a parcel on the map to assess its sidewalk.</p>
    </div>
  </aside>
</div>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<div id="analyticsPanel" class="hidden">
  <div id="analyticsBar">
    <h2>Sidewalk Data</h2>
    <div style="display:flex;gap:8px;">
      <button id="exportBtn" type="button" class="btn secondary">Export (CSV)</button>
      <button id="analyticsClose" type="button">Close</button>
    </div>
  </div>
  <div id="analyticsBody"></div>
</div>
<div id="unsavedDialog" class="modalOverlay" hidden>
  <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="unsavedTitle">
    <button type="button" class="modalClose" id="unsavedCloseBtn" aria-label="Close">&times;</button>
    <h3 id="unsavedTitle">Unsaved changes</h3>
    <p>You have unsaved changes to this sidewalk assessment.</p>
    <div class="modalActions">
      <button type="button" class="btn secondary" id="discardChangesBtn">Discard Changes</button>
      <button type="button" class="btn" id="saveChangesBtn">Save Changes</button>
    </div>
  </div>
</div>
<!-- Bump ?v= here and APP_VERSION in app.js on every app.js change so
     browsers fetch the new file instead of a cached one. -->
<script src="config.js?v=79"></script>
<script src="buildings.js?v=79"></script>
<script src="app.js?v=79"></script>
</body>
</html>
