<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhinebeck Village Sidewalk Survey</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; color: #1a1a1a; }
  header { padding: 10px 14px; border-bottom: 1px solid #ddd; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #appVersion { display: block; text-align: right; font-size: 11px; color: #999; }
  #debug { position: fixed; left: 8px; bottom: 8px; z-index: 2000; background: rgba(255,255,255,.92); border: 1px solid #ccc; padding: 4px 8px; font: 11px monospace; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; color: #555; font-size: 13px; }
  #stats { font-size: 13px; color: #333; }
  #stats b { margin-left: 8px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
  #main { display: flex; height: calc(100vh - 57px); }
  #mapWrap { flex: 1; min-width: 0; position: relative; }
  #map { width: 100%; height: 100%; }
  .mapBtn { position: absolute; z-index: 1000; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .mapBtn.active { background: #1a6b3c; color: #fff; border-color: #1a6b3c; }
  #locateBtn { top: 10px; right: 10px; padding: 8px; line-height: 0; }
  #locateBtn svg { display: block; }
  #showPanelBtn { bottom: 16px; right: 10px; display: none; }
  #panel { width: 320px; border-left: 1px solid #ddd; padding: 14px; overflow-y: auto; background: #fff; min-width: 0; transition: width .3s ease, opacity .25s ease, padding .3s ease; }
  #panel.hidden { display: none; }
  #panel.collapsed { width: 0; padding: 0; opacity: 0; overflow: hidden; border-left-width: 0; }
  #panelToggle { width: 100%; margin: 0 0 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  #panelToggle svg { flex: none; }
  #panel h2 { font-size: 16px; margin: 0 0 8px; }
  #panel .meta { font-size: 13px; color: #555; margin-bottom: 12px; }
  #panel label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  .condRow { display: flex; gap: 8px; margin: 4px 0 12px; }
  .condItem { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .condBox { width: 100%; aspect-ratio: 1 / 1; border: 3px solid transparent; border-radius: 6px; font-size: 18px; font-weight: 700; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
  .condBox.selected { border-color: #1a1a1a; }
  .condBox:focus-visible { outline: 2px solid #1a1a1a; outline-offset: 2px; }
  .condLabel { font-size: 11px; color: #555; text-align: center; }
  #globalBtn { top: 10px; right: 56px; display: flex; align-items: center; gap: 6px; }
  #globalPanel { position: absolute; top: 52px; right: 10px; z-index: 1000; width: 300px; max-width: calc(100vw - 20px); max-height: calc(100% - 64px); overflow-y: auto; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  #globalPanel.hidden { display: none; }
  .optRow { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .optBox { border: 3px solid transparent; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; color: #1a1a1a; }
  .optBox.selected { border-color: #1a1a1a; }
  .optBox:focus-visible { outline: 2px solid #1a1a1a; outline-offset: 2px; }
  .surfaceBox { background: #dbeafe; }
  .issueBox { background: #fef3c7; }
  .priorityBox { background: #e9d5ff; }
  #panel select, #panel textarea, #panel input[type="text"] { width: 100%; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
  #panel textarea { min-height: 70px; resize: vertical; }
  .btn { display: inline-block; padding: 8px 14px; font-size: 14px; border: 0; border-radius: 6px; cursor: pointer; background: #1a6b3c; color: #fff; margin-top: 12px; }
  .btn.secondary { background: #eee; color: #222; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  #saveStatus { font-size: 13px; margin-top: 8px; min-height: 18px; }
  #saveStatus.ok { color: #1a6b3c; }
  #saveStatus.warn { color: #9a6a00; }
  #saveStatus.err { color: #b00020; }
  #viewToggle { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
  #viewToggle button { padding: 5px 10px; font-size: 12px; border: 1px solid #ccc; border-radius: 20px; background: #fff; cursor: pointer; }
  #viewToggle button.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .segRow { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; padding: 9px 10px; margin: 4px 0; font-size: 14px; text-align: left; background: #f5f5f5; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; }
  .segRow:hover { background: #eef4ff; }
  .segDot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .segEmpty { color: #555; font-size: 14px; }
  #backBtn { margin: 0 0 10px; }
  #filters button { padding: 5px 10px; font-size: 12px; border: 1px solid #ccc; border-radius: 20px; background: #fff; cursor: pointer; }
  #filters button.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  #searchRow { display: flex; gap: 6px; margin: 10px 0; }
  #searchWrap { flex: 1; position: relative; min-width: 0; }
  #searchWrap input { width: 100%; }
  #suggestions { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #ccc; border-top: 0; border-radius: 0 0 6px 6px; max-height: 220px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,.15); }
  .sugg { padding: 8px 10px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #eee; }
  .sugg:hover, .sugg.selected { background: #eef4ff; }
  #searchRow button { padding: 8px 10px; }
  #banner { display: none; background: #fff3cd; border: 1px solid #e6c200; padding: 10px 14px; font-size: 13px; }
  #banner code { background: #fff; padding: 1px 4px; border-radius: 3px; }
  #loading { padding: 10px 14px; font-size: 13px; color: #555; }
  @media (max-width: 760px) {
    #main { flex-direction: column; }
    #mapWrap { flex: 1; min-height: 0; }
    #panel { width: 100%; max-height: 45vh; border-left: 0; border-top: 1px solid #ddd; transition: max-height .3s ease, opacity .25s ease, padding .3s ease; }
    #panel.collapsed { width: 100%; max-height: 0; padding: 0; opacity: 0; overflow: hidden; border-top-width: 0; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Rhinebeck Village Sidewalk Survey</h1>
    <p>Tap a parcel to see its sidewalks, or tap a sidewalk line to assess it.</p>
    <span id="appVersion"></span>
  </div>
  <div id="stats"></div>
</header>
<div id="banner"></div>
<div id="debug"></div>
<div id="loading">Loading parcels…</div>
<div id="main">
  <div id="mapWrap">
    <div id="map"></div>
    <button class="mapBtn" id="globalBtn" type="button" aria-label="Show survey options" title="Show survey options"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h13M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg>Survey Options</button>
    <div id="globalPanel" class="hidden">
      <div id="viewToggle">
        <button data-view="sidewalks" class="active">Sidewalks</button>
      </div>
      <div id="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="assessed">Assessed</button>
        <button data-filter="unassessed">Not assessed</button>
      </div>
      <div id="searchRow">
        <div id="searchWrap">
          <input type="text" id="searchInput" placeholder="Search address or parcel ID, e.g. 2 Mill Rd" autocomplete="off">
          <div id="suggestions"></div>
        </div>
        <button class="btn secondary" id="searchBtn" type="button">Go</button>
      </div>
      <button class="btn secondary" id="exportBtn" type="button">Export assessments (CSV)</button>
    </div>
    <button class="mapBtn" id="locateBtn" type="button" aria-label="Locate me" title="Locate me"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <button class="mapBtn" id="showPanelBtn" type="button">Show panel</button>
  </div>
  <aside id="panel">
    <button class="btn secondary" id="panelToggle" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 9l3 3-3 3"/><path d="M10 4v16"/></svg>Hide panel</button>
    <div id="parcelPanel">
      <p style="color:#555; font-size:14px;">Select a parcel on the map to assess its sidewalk.</p>
    </div>
  </aside>
</div>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<!-- Bump ?v= here and APP_VERSION in app.js on every app.js change so
     browsers fetch the new file instead of a cached one. -->
<script src="config.js?v=13"></script>
<script src="app.js?v=13"></script>
</body>
</html>
